<svg xmlns="http://www.w3.org/2000/svg" width="380" height="380" viewBox="0 0 380 380" font-family="'Segoe UI',Arial,sans-serif">
  <rect width="380" height="380" fill="#ffffff"/>
  <text x="190" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#8a2b2b">敲击码 Tap Code (5×5)</text>
  <text x="190" y="50" text-anchor="middle" font-size="12" fill="#666">行敲击 · 停顿 · 列敲击   K 省略(用 C 代)</text>
  <g transform="translate(80,80)">
    <!-- 列号 -->
    <text x="30" y="18" text-anchor="middle" font-size="16" font-weight="bold" fill="#8a2b2b">·1</text>
    <text x="74" y="18" text-anchor="middle" font-size="16" font-weight="bold" fill="#8a2b2b">··2</text>
    <text x="118" y="18" text-anchor="middle" font-size="16" font-weight="bold" fill="#8a2b2b">···3</text>
    <text x="162" y="18" text-anchor="middle" font-size="16" font-weight="bold" fill="#8a2b2b">····4</text>
    <text x="206" y="18" text-anchor="middle" font-size="16" font-weight="bold" fill="#8a2b2b">·····5</text>
    <!-- 行号 -->
    <text x="-14" y="56" text-anchor="middle" font-size="15" font-weight="bold" fill="#8a2b2b">1·</text>
    <text x="-14" y="100" text-anchor="middle" font-size="15" font-weight="bold" fill="#8a2b2b">2··</text>
    <text x="-14" y="144" text-anchor="middle" font-size="15" font-weight="bold" fill="#8a2b2b">3···</text>
    <text x="-14" y="188" text-anchor="middle" font-size="15" font-weight="bold" fill="#8a2b2b">4····</text>
    <text x="-14" y="232" text-anchor="middle" font-size="15" font-weight="bold" fill="#8a2b2b">5·····</text>
    <g stroke="#8a2b2b" stroke-width="1.5" fill="none">
      <rect x="8" y="28" width="220" height="220"/>
      <line x1="52" y1="28" x2="52" y2="248"/>
      <line x1="96" y1="28" x2="96" y2="248"/>
      <line x1="140" y1="28" x2="140" y2="248"/>
      <line x1="184" y1="28" x2="184" y2="248"/>
      <line x1="8" y1="72" x2="228" y2="72"/>
      <line x1="8" y1="116" x2="228" y2="116"/>
      <line x1="8" y1="160" x2="228" y2="160"/>
      <line x1="8" y1="204" x2="228" y2="204"/>
    </g>
    <!-- A B C D E / F G H I J / L M N O P / Q R S T U / V W X Y Z  (K 省略) -->
    <g font-size="18" fill="#222" text-anchor="middle">
      <text x="30" y="56">A</text><text x="74" y="56">B</text><text x="118" y="56">C</text><text x="162" y="56">D</text><text x="206" y="56">E</text>
      <text x="30" y="100">F</text><text x="74" y="100">G</text><text x="118" y="100">H</text><text x="162" y="100">I</text><text x="206" y="100">J</text>
      <text x="30" y="144">L</text><text x="74" y="144">M</text><text x="118" y="144">N</text><text x="162" y="144">O</text><text x="206" y="144">P</text>
      <text x="30" y="188">Q</text><text x="74" y="188">R</text><text x="118" y="188">S</text><text x="162" y="188">T</text><text x="206" y="188">U</text>
      <text x="30" y="232">V</text><text x="74" y="232">W</text><text x="118" y="232">X</text><text x="162" y="232">Y</text><text x="206" y="232">Z</text>
    </g>
  </g>
  <text x="190" y="352" text-anchor="middle" font-size="12" fill="#666">例：H = ·· ··· (2,3)   K 敲成 C = · ···</text>
</svg>
