<svg xmlns="http://www.w3.org/2000/svg" width="960" height="446" viewBox="0 0 960 446" font-family="'Segoe UI','Microsoft YaHei',sans-serif"><rect width="960" height="446" fill="#ffffff"/><text x="480" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#8a2b2b">Chuck Norris 一元码规则图</text><text x="480" y="52" text-anchor="middle" font-size="12" fill="#666666">整条位流做游程：连 1 个数用「0」组，连 0 个数用「00」组——密文里没有 1（与本工具 chuckUnary op 实跑一致）</text><rect x="30" y="64" width="900" height="40" fill="#f7ecea" stroke="#8a2b2b" stroke-width="1"/><text x="46" y="91" text-anchor="start" font-size="15" fill="#1a1a1a" font-family="'Segoe UI','Microsoft YaHei',sans-serif" font-weight="normal">规则① 连续 N 个 1 → 组「0」+ 组「N 个 0」</text><rect x="30" y="110" width="900" height="40" fill="#f7ecea" stroke="#8a2b2b" stroke-width="1"/><text x="46" y="137" text-anchor="start" font-size="15" fill="#1a1a1a" font-family="'Segoe UI','Microsoft YaHei',sans-serif" font-weight="normal">规则② 连续 N 个 0 → 组「00」+ 组「N 个 0」</text><text x="30" y="174" text-anchor="start" font-size="14" fill="#1a1a1a" font-family="'Segoe UI','Microsoft YaHei',sans-serif" font-weight="bold">例 1：</text><text x="84" y="174" text-anchor="start" font-size="14" fill="#1a1a1a" font-family="Consolas,'Courier New',monospace" font-weight="normal">C = 1000011 → CC 位流 = 10000111000011</text><text x="84" y="204" text-anchor="start" font-size="14" fill="#666666" font-family="Consolas,'Courier New',monospace" font-weight="normal">游程：1 | 0000 | 111 | 0000 | 11（字符间无分隔，游程跨界合并）</text><g data-example="0 0 00 0000 0 000 00 0000 0 00" data-input="CC" data-bits="10000111000011"><rect x="84" y="212" width="640" height="40" fill="#ffffff" stroke="#8a2b2b" stroke-width="1"/><text x="104" y="238" text-anchor="start" font-size="14" fill="#8a2b2b" font-family="'Segoe UI','Microsoft YaHei',sans-serif" font-weight="normal">输出：</text><text x="170" y="238" text-anchor="start" font-size="16" fill="#1a1a1a" font-family="Consolas,'Courier New',monospace" font-weight="bold">0 0 00 0000 0 000 00 0000 0 00</text></g><text x="30" y="292" text-anchor="start" font-size="14" fill="#1a1a1a" font-family="'Segoe UI','Microsoft YaHei',sans-serif" font-weight="bold">例 2（dCode 页例位流）：</text><text x="84" y="320" text-anchor="start" font-size="14" fill="#666666" font-family="Consolas,'Courier New',monospace" font-weight="normal">位流 00011110 = 000|1111|0 三游程 → 输出见下</text><g data-example="00 00 0 0000 00 0" data-input="0x1E" data-bits="00011110"><rect x="84" y="332" width="360" height="40" fill="#ffffff" stroke="#8a2b2b" stroke-width="1"/><text x="104" y="358" text-anchor="start" font-size="14" fill="#8a2b2b" font-family="'Segoe UI','Microsoft YaHei',sans-serif" font-weight="normal">输出：</text><text x="170" y="358" text-anchor="start" font-size="16" fill="#1a1a1a" font-family="Consolas,'Courier New',monospace" font-weight="bold">00 00 0 0000 00 0</text></g><text x="30" y="406" text-anchor="start" font-size="13" fill="#666666" font-family="'Segoe UI','Microsoft YaHei',sans-serif" font-weight="normal">解码：组对还原位流（前缀 0/00 + 数量组），按 7/8 位宽度切字符；密文只含 0 与空格，组数为偶数。</text><text x="30" y="428" text-anchor="start" font-size="11" fill="#666666" font-family="'Segoe UI','Microsoft YaHei',sans-serif" font-weight="normal">本图为本箱自制规则图（规则与输出取自本工具 op 实跑，口径同 dCode code-chuck-norris / Codingame）</text></svg>