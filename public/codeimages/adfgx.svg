<svg xmlns="http://www.w3.org/2000/svg" width="380" height="400" viewBox="0 0 380 400" font-family="'Segoe UI',Arial,sans-serif">
  <rect width="380" height="400" fill="#ffffff"/>
  <text x="190" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#8a2b2b">ADFGX 密码表 (5×5)</text>
  <text x="190" y="50" text-anchor="middle" font-size="12" fill="#666">行列首字母取 A/D/F/G/X   I/J 合一   每字母→双码(行,列)</text>
  <g transform="translate(90,80)">
    <!-- 列头 A D F G X -->
    <g font-size="17" font-weight="bold" fill="#8a2b2b" text-anchor="middle">
      <text x="52" y="20">A</text><text x="96" y="20">D</text><text x="140" y="20">F</text><text x="184" y="20">G</text><text x="228" y="20">X</text>
    </g>
    <!-- 行头 A D F G X -->
    <g font-size="17" font-weight="bold" fill="#8a2b2b" text-anchor="middle">
      <text x="8" y="64">A</text><text x="8" y="108">D</text><text x="8" y="152">F</text><text x="8" y="196">G</text><text x="8" y="240">X</text>
    </g>
    <g stroke="#8a2b2b" stroke-width="1.5" fill="none">
      <rect x="30" y="30" width="220" height="220"/>
      <line x1="74" y1="30" x2="74" y2="250"/>
      <line x1="118" y1="30" x2="118" y2="250"/>
      <line x1="162" y1="30" x2="162" y2="250"/>
      <line x1="206" y1="30" x2="206" y2="250"/>
      <line x1="30" y1="74" x2="250" y2="74"/>
      <line x1="30" y1="118" x2="250" y2="118"/>
      <line x1="30" y1="162" x2="250" y2="162"/>
      <line x1="30" y1="206" x2="250" y2="206"/>
    </g>
    <!-- A B C D E / F G H I K / L M N O P / Q R S T U / V W X Y Z  (I/J 合一, 用 I) -->
    <g font-size="18" fill="#222" text-anchor="middle">
      <text x="52" y="58">A</text><text x="96" y="58">B</text><text x="140" y="58">C</text><text x="184" y="58">D</text><text x="228" y="58">E</text>
      <text x="52" y="102">F</text><text x="96" y="102">G</text><text x="140" y="102">H</text><text x="184" y="102">I</text><text x="228" y="102">K</text>
      <text x="52" y="146">L</text><text x="96" y="146">M</text><text x="140" y="146">N</text><text x="184" y="146">O</text><text x="228" y="146">P</text>
      <text x="52" y="190">Q</text><text x="96" y="190">R</text><text x="140" y="190">S</text><text x="184" y="190">T</text><text x="228" y="190">U</text>
      <text x="52" y="234">V</text><text x="96" y="234">W</text><text x="140" y="234">X</text><text x="184" y="234">Y</text><text x="228" y="234">Z</text>
    </g>
  </g>
  <text x="190" y="360" text-anchor="middle" font-size="12" fill="#666">例：C = AF (行 A,列 F)   N = FF (行 F,列 F)</text>
  <text x="190" y="382" text-anchor="middle" font-size="11" fill="#999">注：实战方阵按密钥打乱，本图为标准字母序示例</text>
</svg>
