<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1052" viewBox="0 0 1120 1052" role="img" aria-labelledby="ttl dsc">
  <title id="ttl">童子军木棍密码 · Samurai 变体（横竖角色对调）</title>
  <desc id="dsc">Samurai 变体：横竖角色对调，竖线数 = 元音序号，横线数 = 该元音之后第几个辅音；逐槽计数与经典码互为横竖互换。 本图为本项目按映射表逐槽自制，未复制任何外部图片。</desc>
  <style>
    svg { color: #111; }
    @media (prefers-color-scheme: dark) { svg { color: #f2f2f2; } }
    .card { fill: none; stroke: currentColor; stroke-width: 1.5; stroke-opacity: .45; }
    .hbar, .vbar { fill: currentColor; }
    text { fill: currentColor; font-family: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; }
    .title { font-size: 26px; font-weight: 700; }
    .sub { font-size: 13px; opacity: .82; }
    .group { font-size: 14px; font-weight: 600; opacity: .9; }
    .letter { font-size: 22px; font-weight: 700; }
    .count { font-size: 10.5px; opacity: .66; font-family: ui-monospace, Consolas, monospace; }
    .foot { font-size: 11px; opacity: .6; }
  </style>
  <text class="title" x="40" y="40">童子军木棍密码 · Samurai 变体（横竖角色对调）</text>
  <text class="sub" x="40" y="70">竖线数 = 元音序号（A/E/I/O/U/Y = 1–6）；横线数 = 该元音之后第几个辅音（元音本身为 0）。</text>
  <text class="sub" x="40" y="90">图中横竖笔画交叉排布；本工具文本输出是同一规则的线性写法——默认 vh 先竖后横，可选 hv 先横后竖。</text>
